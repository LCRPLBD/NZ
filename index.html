const el=id=>document.getElementById(id);
const api='https://api.bjj-dev.net/v1/racing/';
const demoRace={raceId:'sample',trackName:'Docklands Sprint',trackId:'DEMO',standings:[{name:'Neptune',progress:.75},{name:'Apex',progress:.50},{name:'Luna',progress:.35}]};
let demo=false,races=[],generation=0,mapVersion=0,timer,lastTrack='';
async function read(route){

 if(!response.ok)throw Error('HTTP '+response.status);
 return response.json();
}
function list(value,keys){
 if(Array.isArray(value))return value;
 for(const key of keys)if(Array.isArray(value?.[key]))return value[key];

}
let route=[],drivers=[],checkpoints=[],closed=false;

 const name=driverName(d);
 const raw=d?.crewTag??d?.crew_tag??d?.crew?.tag;
 const tag=typeof raw==='string'?raw.trim().replace(/^\[|\]$/g,'').trim():'';
 if(!tag||name.startsWith('['+tag+'] '))return name;

}
function raceFlag(value){return value===true||value===1||value==='true'}

function placement(d,i){
 if(retired(d))return 'DNF';
 if(i===0&&!leaderEvidence)return '1*';

}
let leaderEvidence='';
function rankField(d){return Number(d?.position??d?.rank??d?.place)}

 if(!rows)return rows;

 const ranks=classified.map(rankField);
 const leaders=classified.map((d,i)=>raceFlag(d?.isLeader??d?.is_leader)?i:-1).filter(i=>i>=0);
 // Completed classifications take precedence over a lingering live leader flag.
 if(leaders.length===1&&!classified.some(d=>raceFlag(d?.finished))){
   out[0]=classified[leaders[0]];used.add(leaders[0]);
 }
 classified.forEach((d,i)=>{
   const rank=ranks[i];
   if(!used.has(i)&&Number.isInteger(rank)&&rank>0&&rank<=out.length&&ranks.indexOf(rank)===ranks.lastIndexOf(rank)&&out[rank-1]===null){
     out[rank-1]=d;used.add(i);
   }

function locationOnTrack(d){
 const raw=d?.lapProgress??d?.trackProgress??d?.progress;
 if(raw!=null&&raw!==''&&Number.isFinite(+raw)&&+raw>=0&&+raw<=1)return +raw;

 return checkpoints[index];

function roundRoute(points,loop){
 const base=loop?points.slice(0,-1):points;
 if(base.length<3)return points;
 const out=[];
 for(let i=0;i<base.length;i++){
   const b=base[i];
   if(!loop&&(i===0||i===base.length-1)){out.push(b);continue}
   const a=base[(i+base.length-1)%base.length],d=base[(i+1)%base.length];
   const ab=Math.hypot(a[0]-b[0],a[1]-b[1]),bd=Math.hypot(d[0]-b[0],d[1]-b[1]);
   const trim=Math.min(ab*.24,bd*.24,12);
   const start=b.map((v,k)=>v+(a[k]-v)*trim/ab),end=b.map((v,k)=>v+(d[k]-v)*trim/bd);
   for(let j=0;j<=4;j++){const t=j/4;out.push(b.map((v,k)=>(1-t)**2*start[k]+2*t*(1-t)*v+t*t*end[k]))}

 if(loop)out.push(out[0]);
 return out.filter((p,i)=>!i||Math.hypot(p[0]-out[i-1][0],p[1]-out[i-1][1])>1e-7);

let cameraPose=null,cameraFrame=0,cameraTick=0;
let orbitAngle=null;
const motion=new Map();
function easedPosition(state,time){
 const t=Math.max(0,Math.min(1,(time-state.start)/1200));
 return state.from+(state.to-state.from)*t*t*(3-2*t);
}
function packWindow(fractions,loop){
 const sorted=fractions.filter(v=>Number.isFinite(v)&&v>=0&&v<=1).sort((a,b)=>a-b);
 if(sorted.length<3)return sorted;
 const size=Math.ceil(sorted.length*.7),pool=loop?sorted.concat(sorted.map(x=>x+1)):sorted;
 let best=0;
 for(let i=1;i<sorted.length&&i+size<=pool.length;i++){
   if(pool[i+size-1]-pool[i]<pool[best+size-1]-pool[best])best=i;
 }

function sunsetChase(c,positions){
 const sky=c.createLinearGradient(0,0,0,410);
 sky.addColorStop(0,'#141132');sky.addColorStop(.62,'#803d89');sky.addColorStop(1,'#ff83b0');
 c.fillStyle=sky;c.fillRect(0,0,1280,410);
 c.save();c.beginPath();c.arc(510,283,91,0,Math.PI*2);c.clip();
 c.fillStyle='#ffe6a2';for(let y=192;y<375;y+=9)c.fillRect(416,y,190,y<260?9:5);c.restore();
 function poly(points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
 for(let i=0;i<10;i++)poly([[i*150-115,401],[i*150,325+31*Math.sin(i*4)],[i*150+130,401]],'#60396d');
 c.fillStyle='#211c39';c.fillRect(0,399,1280,321);
 const focus=positions.findLastIndex((v,i)=>Number.isFinite(v)&&!retired(drivers[i]));
 if(focus<0){el('telemetry').textContent='Waiting for racer positions.';return}
 const dist=[0];for(let i=1;i<route.length;i++)dist.push(dist[i-1]+Math.hypot(route[i][0]-route[i-1][0],route[i][1]-route[i-1][1]));
 const total=dist.at(-1),unit=total/850;
 function point(s){
   if(closed)s=((s%total)+total)%total;
   let lo=1,hi=dist.length-1;while(lo<hi){const m=(lo+hi)>>1;if(dist[m]<s)lo=m+1;else hi=m}
   const a=route[lo-1],b=route[lo],t=(s-dist[lo-1])/(dist[lo]-dist[lo-1]);
   return a.map((v,k)=>v+(b[k]-v)*t);
 }
 const s=positions[focus]*total,origin=point(s),ahead=point(s+unit*2);
 const dx=ahead[0]-origin[0],dy=ahead[1]-origin[1],len=Math.hypot(dx,dy)||1;
 function sample(at){
   const p=point(at),x=(p[0]-origin[0])/unit,y=(p[1]-origin[1])/unit;
   const z=14+(x*dx+y*dy)/len;
   return {x:640+530*(x*dy-y*dx)/(len*z),y:398+2100/z,w:2250/z,z};
 }
 for(let i=135;i>=-10;i--){const a=sample(s+i*unit),b=sample(s+(i+1)*unit);if(Math.min(a.z,b.z)<3)continue;
   const strip=(l,r,color)=>poly([[a.x+l*a.w,a.y],[b.x+l*b.w,b.y],[b.x+r*b.w,b.y],[a.x+r*a.w,a.y]],color);
   strip(-1,1,'#282641');strip(-1,-.975,'#ff68c5');strip(.975,1,'#8bf0fb');
   if(Math.floor(s/unit+i)%8<4)strip(-.009,.009,'#ac8dae');
 }
 const cars=positions.flatMap((v,i)=>Number.isFinite(v)?[{...sample(v*total),i}]:[]).filter(p=>p.z>4&&p.z<145).sort((a,b)=>b.z-a.z);
 for(const p of cars){const w=760/p.z,x=p.x,y=p.y;
   poly([[x-w,y],[x-w*.94,y-w*.47],[x-w*.59,y-w*.87],[x+w*.57,y-w*.87],[x+w*.96,y-w*.46],[x+w,y]],'#7664ae');
   poly([[x-w*.72,y-w*.47],[x-w*.51,y-w*.77],[x+w*.48,y-w*.77],[x+w*.73,y-w*.47]],'#212039');
   c.fillStyle='#ff548a';for(const sign of [-1,1])c.fillRect(x+sign*w*.72-w*.16,y-w*.35,w*.32,w*.12);
   c.fillStyle='#fff';c.font='bold 15px system-ui';c.textAlign='center';c.fillText(placement(drivers[p.i],p.i)+' '+racerTitle(drivers[p.i]),x,y-w-8);
 }
 c.textAlign='left';el('telemetry').textContent='Chasing '+racerTitle(drivers[focus])+' · estimated from race progress';
}
function paint(){
 cancelAnimationFrame(cameraFrame);
 const c=el('scene').getContext('2d'); c.clearRect(0,0,1280,720);
 if(route.length<2){el('telemetry').textContent=drivers.length?'Waiting for circuit geometry.':'';return}
 const now=performance.now(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const blend=reduce?1:1-Math.exp(-Math.min(80,Math.max(1,now-cameraTick))/220);

 if(orbitAngle===null)orbitAngle=desired;
 const delta=((desired-orbitAngle+540)%360+360)%360-180;
 orbitAngle+=delta*blend;
 let moving=Math.abs(delta)*(1-blend)>.08;

 const seen=new Set();
 const positions=drivers.map(d=>{
   const raw=locationOnTrack(d),key=d?.driverId??d?.racerId??racerTitle(d);
   if(!Number.isFinite(raw)||raw<0||raw>1)return undefined;
   seen.add(key);let state=motion.get(key);
   if(!state||reduce)state={from:raw,to:raw,start:now,raw};
   else if(state.raw!==raw){
     const from=easedPosition(state,now),previous=((from%1)+1)%1;

   }
   motion.set(key,state);
   const value=easedPosition(state,now);
   if(Math.abs(state.to-value)>.00001)moving=true;
   return closed?((value%1)+1)%1:value;

 for(const key of motion.keys())if(!seen.has(key))motion.delete(key);

   sunsetChase(c,positions);cameraTick=now;
   if(moving&&!el('livePage').hidden)cameraFrame=requestAnimationFrame(paint);

 const xs=route.map(p=>p[0]),ys=route.map(p=>p[1]);
 const bounds=values=>values.reduce(([lo,hi],v)=>[Math.min(lo,v),Math.max(hi,v)],[Infinity,-Infinity]);

 const [left,right]=bounds(rotated.map(p=>p[0])),[back,front]=bounds(rotated.map(p=>p[1]));
 const overview=Math.min(1200/Math.max(1,right-left),625/Math.max(1,(front-back)*.70)),faces=[];
 let target=[(left+right)/2,(back+front)/2,overview];
 const pack=packWindow(positions,closed);
 const following=el('cameraMode').value==='pack'&&pack.length>0;

   const cumulative=[0];
   for(let i=1;i<route.length;i++)cumulative.push(cumulative[i-1]+Math.hypot(route[i][0]-route[i-1][0],route[i][1]-route[i-1][1]));
