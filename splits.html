<!doctype html><meta charset="utf-8"><title>Neptune · race splits</title><style>
*{box-sizing:border-box}body{margin:0;color:#f6f5fb;background:transparent;font:500 15px/1.25 system-ui,sans-serif}article{width:min(324px,98vw);margin:4px;padding:8px 11px;background:transparent;text-shadow:0 1px 2px #000,0 0 3px #000}header{display:flex;align-items:baseline;gap:6px;padding-bottom:5px;color:#c6bdd7;font-size:11px}header b{color:white;font-size:12px}#title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#page{margin-left:auto;white-space:nowrap}#rows>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:8px;padding:4px 0}#rows b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}strong,small{font-variant-numeric:tabular-nums}strong{font-size:14px;font-weight:600}small{color:#bdb9cb;font-size:10px}.ahead{color:#97e6d4}.behind{color:#ffbdab}small:empty{display:none}
</style><article id="card" hidden><header><b id="heading">Neptune splits</b><span aria-hidden="true">·</span><span id="title"></span><span id="page"></span></header><section id="rows"></section></article><script>
const el=id=>document.getElementById(id),api='https://api.bjj-dev.net/v1/racing/',demo=new URLSearchParams(location.search).get('demo')==='1';
const params=new URLSearchParams(location.search);
const username=params.get('name')?.trim() || [...params].find(([k,v])=>k && k!=='demo' && !v)?.[0].trim() || 'Neptune';
el('heading').textContent=username+' splits';
document.title=username+' · race splits';
function driverName(d){return typeof d==='string'?d:d?.driverName??d?.racer_name??d?.characterName??d?.displayName??d?.racerName??d?.name??d?.alias??'Unnamed racer'}
function racerTitle(d){
 const name=driverName(d);
 const raw=d?.crewTag??d?.crew_tag??d?.crew?.tag;
 const tag=typeof raw==='string'?raw.trim().replace(/^\[|\]$/g,'').trim():'';
 if(!tag||name.startsWith('['+tag+'] '))return name;
 return '['+tag+'] '+name;
}

function array(x,keys){if(Array.isArray(x))return x;for(const k of keys)if(Array.isArray(x?.[k]))return x[k];return []}
const roster=r=>array(r,['leaderboard','positions','running_order','results','standings','runningOrder','order','racers','participants','drivers','entries','players']);
const mine=d=>driverName(d).trim().toLowerCase()===username.toLowerCase();
async function read(path){const r=await fetch(api+path,{cache:'no-store',signal:AbortSignal.timeout(6000)});if(!r.ok)throw Error(String(r.status));const j=await r.json();return j.data??j}

let previous=null,active=null,history=new Map(),since=0;
const num=v=>v!=null&&v!==''&&Number.isInteger(+v)&&+v>=0?+v:null;
function sample(row){const cp=num(row.checkpoint??row.currentCheckpoint??row.checkpointIndex),lap=num(row.lap??row.currentLap??1);return cp===null||lap===null?null:{lap,cp,key:lap+'/'+cp}}
function observe(row,now){
 const id=String(row.racerId??row.driverId??driverName(row)).toLowerCase(),mark=sample(row);
 let s=history.get(id);if(!s){s={marks:new Map()};history.set(id,s)}
 if(mark&&s.mark&&mark.key!==s.mark.key&&now-s.time<=14000&&
 (mark.lap>s.mark.lap||mark.lap===s.mark.lap&&mark.cp>s.mark.cp)){
   s.marks.set(mark.key,[s.time,now]);
 }
 s.mark=mark;s.time=now;return s;
}
function gap(me,other){
 let latest=null;
 for(const [key,ours] of me.marks){const theirs=other.marks.get(key);if(theirs)latest={key,ours,theirs}}
 if(latest){
   const {key,ours,theirs}=latest;
   const delta=(theirs[0]+theirs[1]-ours[0]-ours[1])/2000;
   return {text:'≈ '+Math.abs(delta).toFixed(2)+'s'+(delta>0?' ahead':delta<0?' behind':''),ref:'L'+key.replace('/',' · CP '),delta};
 }
 if(me.mark&&other.mark){
 const laps=me.mark.lap-other.mark.lap,diff=laps||me.mark.cp-other.mark.cp;
 return {text:diff?Math.abs(diff)+(laps?' lap':' CP')+(laps&&Math.abs(diff)>1?'s':'')+(diff>0?' ahead':' behind'):'Same checkpoint',ref:'Latest report',delta:diff};
 }
 return {text:'Awaiting split',ref:'',delta:0};
}
function raceFlag(v){return v===true||v===1||v==='true'}
function retired(d){return raceFlag(d?.dnf)}
function rankField(d){return Number(d?.position??d?.rank??d?.place)}
function runningOrder(rows){
 if(!rows)return rows;
 const classified=rows.filter(d=>!retired(d)),out=Array(classified.length).fill(null),used=new Set();
 const ranks=classified.map(rankField);
 const leaders=classified.map((d,i)=>raceFlag(d?.isLeader??d?.is_leader)?i:-1).filter(i=>i>=0);
 // Completed classifications take precedence over a lingering live leader flag.
 if(leaders.length===1&&!classified.some(d=>raceFlag(d?.finished))){
   out[0]=classified[leaders[0]];used.add(leaders[0]);
 }
 classified.forEach((d,i)=>{
   const rank=ranks[i];
   if(!used.has(i)&&Number.isInteger(rank)&&rank>0&&rank<=out.length&&ranks.indexOf(rank)===ranks.lastIndexOf(rank)&&out[rank-1]===null){
     out[rank-1]=d;used.add(i);
   }
 });
 const remaining=classified.filter((_,i)=>!used.has(i));
 const numeric=v=>v!=null&&v!==''&&Number.isFinite(Number(v))?Number(v):-1;
 const lap=d=>numeric(d?.lap??d?.currentLap);
 const cp=d=>numeric(d?.checkpoint??d?.currentCheckpoint??d?.checkpointIndex);
 const progress=d=>numeric(d?.lapProgress??d?.trackProgress??d?.progress);
 remaining.sort((a,b)=>{
   const af=raceFlag(a?.finished),bf=raceFlag(b?.finished);
   if(af||bf)return Number(bf)-Number(af);
   return lap(b)-lap(a)||cp(b)-cp(a)||progress(b)-progress(a);
 });
 let cursor=0;
 return out.map(d=>d??remaining[cursor++]).concat(rows.filter(retired));
}

function update(id,title,rows,now){
 rows=runningOrder(rows.filter(d=>!retired(d)));
 if(active!==id){history.clear();since=now;active=id}
 const states=rows.map(d=>observe(d,now)),idx=rows.findIndex(mine);if(idx<0){el('card').hidden=true;return}
 const rivals=rows.map((d,i)=>({d,s:states[i],i})).filter(({i})=>i!==idx&&i>=idx-2&&i<=idx+1);
 el('title').textContent=title;el('page').textContent=demo?'DEMO':'';
 const box=el('rows');box.replaceChildren();
 for(const {d,s,i} of rivals){
 const g=gap(states[idx],s),line=document.createElement('div'),name=document.createElement('b'),value=document.createElement('strong'),ref=document.createElement('small');
 name.textContent='P'+(i+1)+'  '+racerTitle(d);value.textContent=g.text;value.className=g.delta>0?'ahead':g.delta<0?'behind':'';ref.textContent=g.ref==='Latest report'?'':g.ref.replace(' · CP ','/CP');
 line.append(name,value,ref);box.append(line);
 }
 if(!rivals.length)box.textContent='Waiting for opponents';
 el('card').hidden=false;
}
let tracked=null;
async function poll(){let delay=5000;try{
 if(tracked){
   try{
     const data=await read('live/'+encodeURIComponent(previous));
     const detail=data.race??data.races?.[0]??(Array.isArray(data)?data[0]:data);
     const rows=roster(detail).length?roster(detail):roster(data);
     if(rows.some(d=>mine(d)&&!retired(d))){
       update(previous,tracked,rows,Date.now());delay=1000;return;
     }
   }catch(error){if(error.message!=='404')throw error}
   tracked=null;
 }
 const races=array(await read('live'),['races','live','activeRaces']),id=r=>r.raceId??r.race_id??r.id;
 for(const summary of races.slice().sort((a,b)=>Number(id(b)===previous)-Number(id(a)===previous))){
 let r=summary,rows=roster(r);if(id(r)!=null){try{const data=await read('live/'+encodeURIComponent(id(r))),detail=data.race??data.races?.[0]??(Array.isArray(data)?data[0]:data);r={...summary,...detail};const fromDetail=roster(detail);if(fromDetail.length)rows=fromDetail;else if(roster(data).length)rows=roster(data)}catch(error){if(error.message==="429")throw error}}
 if(!rows.some(d=>mine(d)&&!retired(d)))continue;previous=id(summary);
 if(previous!=null)tracked=r.trackName??r.track?.name??r.name??"NightZoom";delay=1000;
 update(previous??r.trackName,r.trackName??r.track?.name??r.name??'NightZoom',rows,Date.now());return;
 }
 active=null;el('card').hidden=true;
 }catch(error){el('card').hidden=true;if(error.message==="429")delay=15000}finally{setTimeout(poll,delay)}}
if(demo){
 const names=[username,...['CHROME','Runner','Maido','hypno','Concrete'].filter(n=>n.toLowerCase()!==username.toLowerCase()).slice(0,4)];
 const frame=(c,t)=>update('demo','Supersonic',names.map((name,i)=>({name,crewTag:i===1?'AWD':'',lap:1,checkpoint:c[i]})),t);
 frame([20,20,20,20,20],1000);frame([20,21,20,20,20],6000);frame([21,22,20,21,20],11000);frame([22,23,21,21,20],16000);
}else poll();</script>
